<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pomotroid Focus Companion Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 32px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #a6adc8; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 6px;
      color: #cdd6f4;
      font-size: 14px;
      margin-bottom: 16px;
    }
    button {
      background: #89b4fa;
      color: #11111b;
      font-weight: 600;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #b4befe; }
    .status { margin-top: 16px; font-size: 13px; color: #a6e3a1; }
  </style>
</head>
<body>
  <h1>Pomotroid Focus Companion</h1>
  <p>Connect this browser extension to Pomotroid on your computer.</p>
  
  <label for="token">Pairing Token</label>
  <input type="text" id="token" placeholder="Paste pairing token from Pomotroid Settings">

  <label for="profileId">Browser Profile ID</label>
  <input type="text" id="profileId" placeholder="Profile Identifier (e.g. personal-chrome)">

  <button id="save">Save & Connect</button>
  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
