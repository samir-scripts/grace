<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus Session Active</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #1e1e2e;
      --fg: #cdd6f4;
      --accent: #f38ba8;
      --surface: #313244;
      --muted: #a6adc8;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin-top: 0;
      color: var(--accent);
      font-size: 24px;
    }
    p {
      color: var(--muted);
      line-height: 1.5;
      font-size: 15px;
    }
    .blocked-url {
      font-family: monospace;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 12px;
      border-radius: 6px;
      word-break: break-all;
      color: var(--fg);
      display: inline-block;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Focus Session Active</h1>
    <p>This website is blocked while your Pomodoro work round is in progress.</p>
    <div class="blocked-url" id="target">Website Blocked</div>
    <p>Stay focused! This page will become accessible once your break begins or the session finishes.</p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
