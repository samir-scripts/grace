name: Build / Test

on:
  push:
    branches: [dev, stage, release, 'bugfix/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [dev, stage, release]

jobs:
  # ── Automated Quality Gate ───────────────────────────────────────────────
  quality-gate:
    name: Quality Gate (Lint, Typecheck, Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify signed extension correspondence
        run: node scripts/build-browser-extensions.mjs --require-signed

      - name: Sync SvelteKit types
        run: npx svelte-kit sync

      - name: Svelte and TypeScript check
        run: npm run check

      - name: Frontend and extension tests
        run: npm test

      - name: Chromium extension integration tests
        run: npm run test:chrome-integration

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust unit and integration tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --skip test_accessibility_commands_callable
