name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: grace-nightly
  cancel-in-progress: false

jobs:
  draft:
    name: Request signed nightly draft
    if: github.repository == 'samir-scripts/grace' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check reviewed dev and dispatch the signed release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-nightly.mjs schedule
