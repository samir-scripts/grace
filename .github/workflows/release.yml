name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing release tag
        required: true
        type: string
      candidate_run_id:
        description: Existing exact-source release build run to promote (stable only; avoids rebuilding accepted bytes)
        required: false
        type: string
      acceptance_ref:
        description: Reviewed evidence commit SHA (stable releases only)
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ── Pre-Release Quality & Verification Gate ────────────────────────────────
  release-check:
    name: Release Gate (Typecheck, Extension Integrity, Tests)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
      prerelease: ${{ steps.policy.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate release tag and project versions
        id: policy
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {classifyTag, validateVersions, readVersions} from './scripts/release-policy.mjs';
          const result = classifyTag(process.env.RELEASE_TAG);
          validateVersions(result.version, readVersions());
          if(result.prerelease === 'true' && process.env.CANDIDATE_RUN_ID) throw new Error('Candidate reuse is reserved for stable promotion');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${result.version}\nprerelease=${result.prerelease}\n`);
          JS

      - name: Verify signed extension correspondence
        run: node scripts/build-browser-extensions.mjs --require-signed

      - name: Sync SvelteKit types
        run: npx svelte-kit sync

      - name: Svelte and TypeScript check
        run: npm run check

      - name: Frontend and extension tests
        run: npm test

      - name: Chromium extension integration tests
        run: npm run test:chrome-integration

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust unit and integration tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --skip test_accessibility_commands_callable

  # ── Extract release notes from CHANGELOG ───────────────────────────────────
  changelog:
    name: Extract release notes
    runs-on: ubuntu-latest
    needs: release-check
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
      version: ${{ needs.release-check.outputs.version }}
      prerelease: ${{ needs.release-check.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract CHANGELOG section
        id: extract
        env:
          RELEASE_VERSION: ${{ needs.release-check.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const lines=fs.readFileSync('CHANGELOG.md','utf8').split('\n');
          const start=lines.indexOf(`[v${process.env.RELEASE_VERSION}]`);
          if(start<0) throw new Error('Missing release changelog');
          const next=lines.findIndex((line,i)=>i>start && /^\[v\d/.test(line));
          const notes=lines.slice(start+1,next<0?undefined:next).join('\n').trim();
          if(!notes) throw new Error('Empty release changelog');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes<<GRACE_RELEASE_NOTES\n${notes}\nGRACE_RELEASE_NOTES\n`);
          JS

  # ── Linux build ────────────────────────────────────────────────────────────
  build-linux:
    if: inputs.candidate_run_id == ''
    name: Linux x64
    runs-on: ubuntu-latest
    needs: [release-check, changelog]
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Sync SvelteKit types
        run: npx svelte-kit sync

      - name: Import GPG signing key
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build (release)
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}' --bundles deb,appimage,rpm
        env:
          CI: true

      - name: Sign Linux artifacts
        if: env.GPG_PASSPHRASE != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for f in \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage; do
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
              --pinentry-mode loopback --detach-sign --armor "$f"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grace-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.asc
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.asc
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.asc
          if-no-files-found: error

  # ── macOS build ────────────────────────────────────────────────────────────
  build-macos:
    if: inputs.candidate_run_id == ''
    name: macOS (universal)
    runs-on: macos-latest
    needs: [release-check, changelog]
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable (with universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Sync SvelteKit types
        run: npx svelte-kit sync

      - name: Build (release, universal binary)
        run: npm run build:macos-universal -- --updater
        env:
          CI: true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grace-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # ── Windows build ──────────────────────────────────────────────────────────
  build-windows:
    if: inputs.candidate_run_id == ''
    name: Windows x64
    runs-on: windows-latest
    needs: [release-check, changelog]
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    outputs:
      installer_hash: ${{ steps.hash.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Sync SvelteKit types
        run: npx svelte-kit sync

      - name: Build (release)
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}' --bundles nsis
        env:
          CI: true

      - name: Compute installer hash
        id: hash
        shell: bash
        run: |
          hash=$(sha256sum src-tauri/target/release/bundle/nsis/*-setup.exe | cut -d' ' -f1)
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grace-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/pomotroid.exe
          if-no-files-found: error

  # ── Create draft GitHub Release ────────────────────────────────────────────
  release:
    if: always() && needs.changelog.result == 'success' && (inputs.candidate_run_id != '' || (needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success'))
    name: Create draft release
    permissions:
      contents: write
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    needs: [changelog, build-linux, build-macos, build-windows]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable stable candidate
        if: inputs.candidate_run_id != ''
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-candidate-run.mjs "$CANDIDATE_RUN_ID" "$(git rev-parse HEAD)"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: grace-linux-x64
          path: dist/linux
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: grace-macos-universal
          path: dist/macos
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: grace-windows-x64
          path: dist/windows
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install release signing tools
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign and verify every downloadable package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-release-artifacts.mjs --artifacts dist

      - name: Generate latest.json updater manifest
        if: needs.changelog.outputs.prerelease == 'false'
        run: |
          VERSION="${{ needs.changelog.outputs.version }}"
          REPO="https://github.com/${{ github.repository }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          APP_TAR_FILE=$(find dist/macos -name "*.app.tar.gz" ! -name "*.sig" | head -1)
          APP_TAR_SIG=$(cat "${APP_TAR_FILE}.sig" 2>/dev/null || echo "")
          NSIS_FILE=$(find dist/windows -name "*-setup.exe" ! -name "*.sig" | head -1)
          NSIS_SIG=$(cat "${NSIS_FILE}.sig" 2>/dev/null || echo "")

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg notes "See $REPO/releases/tag/v$VERSION for release notes." \
            --arg darwin_url "$REPO/releases/download/v$VERSION/grace-macos-universal-$VERSION.app.tar.gz" \
            --arg darwin_sig "$APP_TAR_SIG" \
            --arg windows_url "$REPO/releases/download/v$VERSION/grace-windows-x64-$VERSION-setup.exe" \
            --arg windows_sig "$NSIS_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $darwin_sig, url: $darwin_url },
                "darwin-x86_64": { signature: $darwin_sig, url: $darwin_url },
                "windows-x86_64": { signature: $windows_sig, url: $windows_url }
              }
            }' > latest.json

      - name: Load reviewed stable acceptance
        if: needs.changelog.outputs.prerelease == 'false'
        env:
          ACCEPTANCE_REF: ${{ inputs.acceptance_ref }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [ -n "$CANDIDATE_RUN_ID" ] || { echo 'Stable publication requires an immutable candidate run'; exit 1; }
          [[ "$ACCEPTANCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Stable releases require a reviewed evidence commit'; exit 1; }
          git fetch origin "$ACCEPTANCE_REF"
          mkdir -p plans/evidence
          git show FETCH_HEAD:plans/evidence/stable-acceptance.json > plans/evidence/stable-acceptance.json

      - name: Prepare exact public assets and acceptance gate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ needs.changelog.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--tag "$RELEASE_TAG" --artifacts dist --output release-assets --source-revision "$(git rev-parse HEAD)")
          if [ "$PRERELEASE" = false ]; then
            args+=(--reports plans/evidence/stable-acceptance.json)
          fi
          node scripts/prepare-release.mjs "${args[@]}"
          if [ "$PRERELEASE" = false ]; then
            cp latest.json release-assets/latest.json
            (cd release-assets && sha256sum latest.json >> SHA256SUMS)
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          prerelease: ${{ needs.changelog.outputs.prerelease == 'true' }}
          make_latest: false
          name: ${{ inputs.tag || github.ref_name }}
          body: ${{ needs.changelog.outputs.notes }}
          files: release-assets/*
